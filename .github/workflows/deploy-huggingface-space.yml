name: 部署中文在线平台到 Hugging Face Space

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-huggingface-space-zh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 读取当前版本
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装部署工具
        run: python -m pip install "huggingface_hub==2.2.0"

      - name: 检查部署包
        run: python deploy/huggingface/deploy.py --dry-run

      - name: 创建或更新公开 Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python deploy/huggingface/deploy.py
